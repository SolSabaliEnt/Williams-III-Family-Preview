<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Williams III</title><link rel="stylesheet" href="/Williams-III-Family-Preview/site.css">


  <link data-wiii-favicon="true" rel="icon" type="image/png" sizes="32x32" href="assets/favicon-wiii-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-wiii-64.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-wiii-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon-wiii.png">
</head><body><aside class="rail"><a href="/Williams-III-Family-Preview/"><img src="/Williams-III-Family-Preview/assets/master.svg" alt="Williams III"></a><a class="menu" href="/Williams-III-Family-Preview/companies/">MENU</a><div class="caption">Search</div></aside><main class="main" id="app"></main><script>
const B="/Williams-III-Family-Preview/";
const companies={
"covre":["Covre","Family Office","Family Owned","Digital Venture","Covre Logo Main.png"],
"pleiotaxy":["Pleiotaxy","Family Office","Family Owned","Technology","PleioTAXy Logo Horizontal.png"],
"maatra":["Maatra","Family Office","Family Owned","Digital Platform","maatra horizontal.png"],
"re-continuity":["re:continuity","Family Office","Family Owned","Infrastructure","re-continuity-icon.png"],
"lot":["LOT","Family Office","Family Owned","Application","Lot Logo Official.png"],
"relayed":["Relayed","Family Office","Family Owned","Digital Venture","Relayed logo.png"],
"cleanr":["Cleanr","Family Holdings","Portfolio Interest","Technology / Services","cleanr-app@2x.png"],
"docc":["DOCC","Family Holdings","Portfolio Interest","Technology","docc-horizontal.png"],
"mtc":["MTC","Family Holdings","Portfolio Interest","Operating Company","mtc logo.png"],
"re-eat":["re:eat","Family Holdings","Portfolio Interest","Consumer Technology","Re Eat Horizontal Logo.png"]
};
const route=location.pathname.replace(B,"").replace(/^\/+|\/+$/g,"");
const foot='<footer class="footer"><div class="footer-grid"><div><img src="'+B+'assets/master.svg"><p>A family enterprise spanning proprietary ventures, intellectual property, strategic ownership interests, and long-term stewardship.</p></div><div><h4>Enterprise</h4><nav><a href="'+B+'family-office/">Family Office</a><a href="'+B+'family-holdings/">Family Holdings</a><a href="'+B+'companies/">Companies</a><a href="'+B+'digital-estate/">Digital Estate</a></nav></div><div><h4>Institution</h4><nav><a href="'+B+'story/">Our Story</a><a href="'+B+'leadership/">Leadership</a><a href="'+B+'principles/">Principles</a><a href="'+B+'contact/">Contact</a></nav></div></div></footer>';
function logos(list){return '<div class="cards">'+list.map(s=>{const c=companies[s];return '<a class="card" href="'+B+'companies/'+s+'/"><img src="'+B+'assets/'+c[4]+'" alt="'+c[0]+'"><small>'+c[2]+'</small><h3>'+c[0]+'</h3><p>'+c[3]+'</p><div class="link">View company →</div></a>'}).join("")+'</div>'}
function hero(k,h,p,img){return '<section class="hero"><div class="hero-copy"><div class="eyebrow">'+k+'</div><h1 class="display">'+h+'</h1><p>'+p+'</p></div>'+(img?'<div class="hero-media"><img src="'+B+'assets/'+img+'" alt="'+h+'"></div>':'')+'</section>'}
let html="";
if(route==="family-office"){html=hero("Enterprise","Family Office","Wholly family-owned ventures, proprietary assets, intellectual property, and long-term stewardship.","Williams Family Office LOGO.png")+'<section class="section"><div class="split"><div><div class="eyebrow">Mandate</div><h2>Own what is proprietary. Build for continuity.</h2></div><div class="prose"><p>The Family Office is the home for ventures and assets intended to remain wholly within the family enterprise.</p><p>Its purpose is clarity: proprietary ventures and intellectual property sit here, distinct from shared opportunities and outside partnerships.</p></div></div>'+logos(["covre","pleiotaxy","maatra","re-continuity","lot","relayed"])+'</section>';}
else if(route==="family-holdings"){html=hero("Enterprise","Family Holdings","Strategic interests, partnerships, joint ventures, and shared opportunities.","Williams Family Holdings logo.png")+'<section class="section"><div class="split"><div><div class="eyebrow">Mandate</div><h2>Participate selectively. Hold with discipline.</h2></div><div class="prose"><p>Family Holdings represents Williams III interests in opportunities built with partners or held alongside other stakeholders.</p></div></div>'+logos(["cleanr","docc","mtc","re-eat"])+'</section>';}
else if(route==="companies"){html=hero("Portfolio","Companies","A concise view of ventures and selected interests across the Williams III enterprise.","master.svg")+'<section class="section"><div class="eyebrow">Family Office</div><h2>Wholly family-owned.</h2>'+logos(["covre","pleiotaxy","maatra","re-continuity","lot","relayed"])+'</section><section class="section"><div class="eyebrow">Family Holdings</div><h2>Strategic interests.</h2>'+logos(["cleanr","docc","mtc","re-eat"])+'</section>';}
else if(route==="story"){html='<header class="story-head"><div class="crumb"><a href="'+B+'">Home</a> / Williams III</div><h1>OUR STORY</h1></header><section class="section"><div class="story-intro"><div class="story-photo"><img src="'+B+'assets/rwiii headshot update.png"></div><div class="story-copy"><div class="eyebrow">Origins</div><h2>It begins with an idea.</h2><p>In 2018, the idea for Cleanr marked the beginning of the entrepreneurial record presented by Williams III.</p><p>From that point, the record expands through concepts, digital products, proprietary ventures, and strategic interests.</p></div></div><div class="timeline-shell"><div class="timeline-tabs"><button class="active">2018</button><button>2019–2022</button><button>2023–2025</button><button>2026–today</button></div><div class="timeline-pane active"><div><div class="year">2018</div><h3>Cleanr idea born.</h3><p>The starting point of the public entrepreneurial record.</p></div><div class="timeline-visual"><img src="'+B+'assets/rwiii headshot update.png"></div></div></div></section>';}
else if(route==="leadership"){html=hero("Institution","Leadership","The founder and steward behind Williams III.","rwiii headshot update.png")+'<section class="section"><div class="split"><div><div class="eyebrow">Robert Williams III</div><h2>Builder. Owner. Steward.</h2></div><div class="prose"><p>The public entrepreneurial record begins in 2018 with the idea for Cleanr. From that starting point, the work expands across ventures, digital products, intellectual property, and strategic interests.</p></div></div></section>';}
else if(route==="principles"){html=hero("Institution","Principles","A concise operating framework for ownership, partnership, and stewardship.","master.svg")+'<section class="section navy"><div class="principles"><article><b>01</b><h3>Build with conviction</h3><p>Create and support companies with clear purpose and durable utility.</p></article><article><b>02</b><h3>Protect what is proprietary</h3><p>Keep family-owned intellectual property and ventures distinct from shared interests.</p></article><article><b>03</b><h3>Partner selectively</h3><p>Participate where incentives, values, and long-term interests align.</p></article><article><b>04</b><h3>Think in generations</h3><p>Treat governance, reputation, and stewardship as assets.</p></article></div></section>';}
else if(route==="digital-estate"){html=hero("Stewardship","Digital Estate","The digital infrastructure and records that support continuity across the enterprise.","master.svg")+'<section class="section">'+logos([])+'<div class="split"><div><h2>Brands, code, domains, and archive.</h2></div><div class="prose"><p>The digital estate organizes the identities, repositories, product records, domains, and historical material that support continuity.</p></div></div></section>';}
else if(route==="contact"){html=hero("Contact","Start with the right context.","Business, partnership, institutional, and media inquiries can be routed here as the public presence develops.","master.svg")+'<section class="section"><div class="split"><div><h2>Williams III</h2></div><div class="prose"><p>Public-facing contact information will live here with the production domain.</p></div></div></section>';}
else if(route==="private-access"){html=hero("Private Access","Private access","A future authenticated layer for family, governance, and deal-room resources.","master.svg");}
else if(route.startsWith("companies/")){const slug=route.split("/")[1],c=companies[slug];if(c){html=hero(c[1],c[0],c[0]+' is presented by Williams III as '+(c[1]==="Family Office"?"a wholly family-owned venture.":"a selected strategic interest."),c[4])+'<section class="section"><div class="facts"><div class="fact"><span>Relationship</span><strong>'+c[2]+'</strong></div><div class="fact"><span>Sector</span><strong>'+c[3]+'</strong></div><div class="fact"><span>Mandate</span><strong>'+c[1]+'</strong></div></div><div class="split"><div><div class="eyebrow">Within Williams III</div><h2>'+(c[1]==="Family Office"?"Proprietary venture.":"Strategic interest.")+'</h2></div><div class="prose"><p>This page establishes the public Williams III record for '+c[0]+'. Company-specific history, imagery, milestones, and operating information can be added as public materials are approved.</p></div></div></section>';}}
if(!html){html=hero("Williams III","Page not found","Return to the Williams III home page.","master.svg");}
document.getElementById("app").innerHTML=html+foot;
</script></body></html>
