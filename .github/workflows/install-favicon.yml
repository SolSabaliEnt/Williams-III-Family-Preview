name: Install Williams III favicon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-favicon.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build favicon assets from master mark
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("assets/williams iii master mark.png")
          im = Image.open(src).convert("RGBA")

          # Trim transparent space while preserving the official mark itself.
          bbox = im.getbbox()
          if bbox:
              im = im.crop(bbox)

          def square_icon(size, out):
              icon = Image.new("RGBA", (size, size), (0,0,0,0))
              copy = im.copy()
              copy.thumbnail((int(size*0.88), int(size*0.88)), Image.Resampling.LANCZOS)
              x = (size-copy.width)//2
              y = (size-copy.height)//2
              icon.alpha_composite(copy, (x,y))
              icon.save(out, optimize=True)

          square_icon(32, "assets/favicon-32.png")
          square_icon(192, "assets/favicon-192.png")
          square_icon(180, "assets/apple-touch-icon.png")
          PY

      - name: Add favicon declarations to every HTML page
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re

          for page in Path(".").rglob("*.html"):
              if ".git" in page.parts:
                  continue
              html = page.read_text(encoding="utf-8")
              if 'data-wiii-favicon="true"' in html:
                  continue

              rel32 = os.path.relpath("assets/favicon-32.png", page.parent).replace(os.sep, "/")
              rel192 = os.path.relpath("assets/favicon-192.png", page.parent).replace(os.sep, "/")
              relapple = os.path.relpath("assets/apple-touch-icon.png", page.parent).replace(os.sep, "/")

              tags = (
                  f'  <link data-wiii-favicon="true" rel="icon" type="image/png" sizes="32x32" href="{rel32}">\n'
                  f'  <link rel="icon" type="image/png" sizes="192x192" href="{rel192}">\n'
                  f'  <link rel="apple-touch-icon" sizes="180x180" href="{relapple}">\n'
              )

              if "</head>" in html:
                  html = html.replace("</head>", tags + "</head>", 1)
              else:
                  continue
              page.write_text(html, encoding="utf-8")
          PY

      - name: Commit favicon installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/favicon-32.png assets/favicon-192.png assets/apple-touch-icon.png '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo "No favicon changes needed."
            exit 0
          fi
          git commit -m "Install Williams III favicon sitewide"
          git push
